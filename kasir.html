<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kasir — Cendana House Coffee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef7fb; --white:#fff; --ink:#1b365d; --muted:#4d7a99; --brand:#005a9c;
  --line:#b8d8ea; --line2:#c8e8f5; --tint:#d0eff8; --tint2:#e0f0fa; --panel:#f0f8fc;
  --ok:#2e7d32; --okbg:#ebf7ee; --err:#c0392b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg.i{display:block;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{min-height:100vh;display:flex;flex-direction:column}

/* nav */
.nav{height:88px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;flex:none}
.brand{display:flex;gap:12px;align-items:center}
.mark{width:42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}
.brand b{display:block;font-family:'Lora',serif;font-weight:400;font-size:22px;color:var(--brand);line-height:1.2}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:1px}
.ws{background:var(--bg);border-radius:10px;padding:5px;display:flex;gap:4px}
.ws button{height:40px;padding:0 24px;border-radius:8px;display:flex;gap:9px;align-items:center;font-size:14px;font-weight:600;color:var(--muted)}
.ws button.on{background:#fff;color:var(--brand);box-shadow:0 0 0 3px #e2f1f8}
.shift{display:flex;gap:16px;align-items:center}
.pill{background:var(--tint);border-radius:100px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
.shift .op b{display:block;font-size:13px;font-weight:600}
.shift .op span{display:block;font-size:11px;color:var(--muted);margin-top:2px}

/* pos */
.pos{flex:1;display:flex;min-height:0}
.catalog{flex:1;min-width:0;padding:24px;display:flex;flex-direction:column;gap:14px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.chead h1{font-size:26px;font-weight:400;line-height:1.2}
.chead p{font-size:13px;color:var(--muted);margin-top:3px}
.search{height:46px;background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;gap:10px;align-items:center;padding:0 16px;color:var(--muted)}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:14px;min-width:0;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search kbd{font:12px 'Inter';color:var(--muted)}
.cats{display:flex;gap:8px;flex-wrap:wrap}
.cat{height:40px;padding:0 20px;border-radius:100px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.cat.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column;height:164px;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 14px rgba(0,90,156,.12)}
.card.sel{border:1.5px solid var(--brand)}
.card .ph{height:88px;flex:none;background:#e9e4dc;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .d{padding:12px;display:flex;flex-direction:column;gap:5px}
.card .n{font-size:14px;font-weight:600}
.card .r{display:flex;justify-content:space-between;align-items:center}
.card .p{font-size:13px;font-weight:600;color:var(--brand)}
.card .plus{width:28px;height:28px;border-radius:8px;background:var(--bg);color:var(--brand);display:grid;place-items:center}
.card.sel .plus{background:var(--tint)}
.foot{font-size:11px;color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:13px;padding:32px 0}

/* cart */
.side{width:384px;flex:none;background:#fff;border-left:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:18px}
.side .top{display:flex;flex-direction:column;gap:18px;flex:1;min-height:0;overflow:auto}
.sh{display:flex;justify-content:space-between;align-items:center}
.sh h2{font-size:21px;font-weight:400}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:8px}
.inp{height:44px;border:1px solid var(--line);border-radius:10px;display:flex;gap:10px;align-items:center;padding:0 12px;color:var(--muted)}
.inp.err{border-color:var(--err)}
.inp input{border:0;outline:0;flex:1;min-width:0;font-size:14px;background:transparent;color:var(--ink)}
.inp input::placeholder{color:var(--muted)}
.meta{display:flex;justify-content:space-between;font-size:12px}
.meta span{color:var(--muted)}
.meta button{color:var(--brand)}
.oi{border-bottom:1px solid var(--line);padding-bottom:16px;display:flex;flex-direction:column;gap:10px}
.oi .h{display:flex;justify-content:space-between;font-weight:600}
.oi .h span:first-child{font-size:14px}.oi .h span:last-child{font-size:13px}
.oi .q{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.qty{height:36px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center}
.qty button{width:36px;height:36px;display:grid;place-items:center;color:var(--ink)}
.qty span{min-width:18px;text-align:center;font-size:14px;font-weight:600;color:var(--ink)}
.note label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.note .in{height:38px;background:#f0f9fd;border:1px solid var(--line);border-radius:8px;display:flex;gap:8px;align-items:center;padding:0 10px;color:var(--muted)}
.note input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:12px;color:var(--ink)}
.note input::placeholder{color:var(--muted)}
.none{font-size:13px;color:var(--muted);padding:8px 0}
.sum{display:flex;flex-direction:column;gap:12px}
.sum .r{display:flex;justify-content:space-between;font-size:14px}
.sum .r span:first-child{color:var(--muted)}
.sum .t{border-top:1px solid var(--line);padding-top:14px;align-items:center}
.sum .t span:first-child{font-size:18px;font-weight:600;color:var(--ink)}
.sum .t span:last-child{font-size:23px;font-weight:600;color:var(--brand)}
.go{height:54px;border-radius:10px;background:var(--brand);color:#fff;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:center;width:100%}
.go:disabled{opacity:.45;cursor:not-allowed}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(32,24,19,.6);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;overflow-y:auto}
.scrim.show{display:flex}
.dlg{background:#fff;border:1px solid #e8e2d9;border-radius:24px;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);width:100%;max-width:896px;margin:auto;overflow:hidden}
.dh{background:var(--panel);border-bottom:1px solid var(--line2);padding:20px 28px 21px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.dh .id{display:flex;gap:12px;align-items:center}
.dh .sym{width:36px;height:36px;border-radius:50%;background:#cce9f5;color:var(--brand);display:grid;place-items:center;flex:none}
.dh h2{font-size:16px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dh .no{background:var(--tint);color:var(--brand);font-size:11px;font-weight:700;padding:2px 10px;border-radius:100px}
.dh p{font-size:12px;color:var(--muted);margin-top:2px}
.dh p b{color:var(--ink);font-weight:600}
.dx{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.dbody{display:grid;grid-template-columns:5fr 7fr}
.lsum{background:rgba(240,248,252,.5);padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.lsum .ttl{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:12px}
.lsum .ttl b{font-weight:700;letter-spacing:.6px}
.li{background:#fff;border:1px solid var(--line2);border-radius:12px;padding:15px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.li+.li{margin-top:14px}
.li .t{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:600}
.li .t .x{background:var(--tint);color:var(--brand);font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;margin-right:8px}
.li .nt{background:var(--panel);border:1px solid #cce9f5;border-radius:8px;padding:7px 11px;display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
.calc{border-top:1px solid var(--line2);padding-top:17px;display:flex;flex-direction:column;gap:8px}
.calc .r{display:flex;justify-content:space-between;font-size:12px}
.calc .r span:first-child{color:var(--muted)}
.calc .r .g{color:var(--ok)}
.gt{background:var(--panel);border:1px dashed var(--line2);border-radius:16px;height:74px;padding:0 16px;display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.gt small{display:block;font-size:11px;font-weight:700;letter-spacing:.55px;color:var(--muted)}
.gt small+small{font-weight:400;color:#60c1e5;margin-top:1px}
.gt b{font-size:24px;font-weight:700;color:var(--brand);letter-spacing:-.6px}
.rpay{border-left:1px solid var(--line2);padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.rh b{font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--muted)}
.online{display:flex;gap:4px;align-items:center;background:var(--okbg);color:var(--ok);font-size:11px;font-weight:500;padding:2px 8px;border-radius:100px}
.online::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.tabs{background:var(--tint);border-radius:16px;padding:4px;display:flex;gap:8px}
.tab{flex:1;height:42px;border-radius:12px;display:flex;gap:8px;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted)}
.tab.on{background:#fff;color:var(--brand);font-weight:700;border:1px solid #a0e0ef;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.tab.on.q,.tab.on.d{background:var(--brand);color:#fff;border-color:var(--brand)}
.pane{padding-top:20px;display:flex;flex-direction:column;gap:20px}
.lbl{font-size:12px;font-weight:700;margin-bottom:8px;display:block}
.cash-in{position:relative}
.cash-in .rp{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-weight:700;font-size:14px;color:var(--muted)}
.cash-in input{width:100%;height:56px;background:var(--panel);border:2px solid var(--brand);border-radius:12px;padding:0 80px 0 50px;font-size:18px;font-weight:700;outline:0;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.cash-in .bd{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--okbg);color:var(--ok)}
.cash-in .bd.no{background:#fdecea;color:var(--err)}
.kemb{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:17px;display:flex;justify-content:space-between;align-items:center}
.kemb .l{display:flex;gap:12px;align-items:center}
.kemb .ic{width:40px;height:40px;border-radius:12px;background:#e8f5e9;color:var(--ok);display:grid;place-items:center}
.kemb small{display:block;font-size:11px;font-weight:600;letter-spacing:.55px;color:var(--muted)}
.kemb small+span{display:block;font-size:12px;color:var(--muted);margin-top:5px}
.kemb b{font-size:20px;font-weight:700;color:var(--ok);letter-spacing:-.5px}
.kemb b.warn{color:var(--err)}
.qpanel{background:#eef4f9;border:1px solid var(--line2);border-radius:16px;padding:24px 21px 22px;display:flex;flex-direction:column;gap:16px}
.qtop{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line2);padding-bottom:13px}
.qtop .a{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:700}
.qtop .a i{font-style:normal;background:var(--brand);color:#fff;font-size:10px;letter-spacing:1px;padding:2px 8px;border-radius:4px}
.stat{display:flex;gap:6px;align-items:center;background:var(--tint2);color:var(--brand);font-size:11px;font-weight:600;padding:4px 10px;border-radius:100px}
.stat::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand)}
.stat.ok{background:var(--okbg);color:var(--ok)}.stat.ok::before{background:var(--ok)}
.stat.bad{background:#fdecea;color:var(--err)}.stat.bad::before{background:var(--err)}
.qbody{display:grid;grid-template-columns:5fr 7fr;gap:20px;align-items:center}
.qcode{display:flex;flex-direction:column;align-items:center}
.qbox{position:relative;background:#fff;border:2px solid rgba(0,90,156,.2);border-radius:16px;padding:12px;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.qbox .badge{position:absolute;bottom:-8px;left:10px;background:var(--ink);color:#fff;font-size:9px;font-weight:700;letter-spacing:.45px;padding:2px 8px;border-radius:100px}
.qbox.dim svg{opacity:.25}
.timer{margin-top:14px;display:flex;gap:6px;align-items:center;background:var(--tint2);color:var(--brand);font-size:11px;font-weight:600;padding:4px 12px;border-radius:100px;white-space:nowrap}
.timer b{font:700 11px ui-monospace,Menlo,monospace}
.qinfo{display:flex;flex-direction:column;gap:12px}
.qc{background:#fff;border:1px solid var(--line2);border-radius:12px;padding:15px}
.qc small{display:block;font-size:11px;font-weight:600;letter-spacing:.55px;color:var(--muted)}
.qc b{display:block;font-size:24px;font-weight:700;color:var(--brand);letter-spacing:-.6px;margin:2px 0}
.qc p{font-size:11px;color:var(--muted);line-height:1.5}
.qc.s{padding:13px}.qc.s small{font-size:10px;letter-spacing:.5px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--tint2);color:var(--brand);font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px}
.chk{height:42px;border:1px solid #9bbfdf;background:#eef4f9;border-radius:12px;color:var(--brand);font-size:12px;font-weight:700;display:flex;gap:8px;align-items:center;justify-content:center}
.edc{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:14px 14px 14px;display:flex;flex-direction:column;gap:10px}
.edc .hd{display:flex;justify-content:space-between;gap:8px}
.edc .hd b{display:block;font-size:12px;font-weight:700}
.edc .hd span.s{display:block;font-size:11px;color:var(--muted);margin-top:6px}
.edc .on{align-self:flex-start;font-size:10px;font-weight:700;color:var(--brand);background:var(--tint2);padding:3px 10px;border-radius:100px;display:flex;gap:5px;align-items:center;white-space:nowrap}
.edc .on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand)}
.row3{display:flex;gap:8px}
.opt{flex:1;height:38px;border:1px solid var(--line2);background:#fff;border-radius:10px;font-size:12px;font-weight:600;color:var(--muted)}
.opt.on{border:2px solid var(--brand);color:var(--brand);font-weight:700}
.iss{display:flex;gap:6px}
.iss .opt{background:var(--tint2);border-color:transparent;height:30px;border-radius:6px;display:flex;gap:6px;align-items:center;justify-content:center}
.iss .opt.on{background:var(--brand);color:#fff;border:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{height:34px;border-radius:8px;background:var(--tint2);border:1px solid var(--line2);display:flex;align-items:center;padding:0 12px;font-size:12px;font-weight:700;gap:8px}
.fld input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:12px}
.fld.f{background:#fff;border:2px solid var(--brand);height:38px}
.fld.f.err{border-color:var(--err)}
.fld.f input{font-weight:600}
.fld.f input::placeholder{font-weight:500;color:var(--muted)}
.hint{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.45}
.hint.err{color:var(--err)}
.guide{background:var(--tint2);border:1px solid var(--line2);border-radius:12px;padding:12px;display:flex;gap:10px;color:var(--brand)}
.guide b{display:block;font-size:11px;color:var(--ink);margin-bottom:2px}
.guide span{font-size:11px;color:var(--muted);line-height:1.5}
.print{border-top:1px solid var(--line2);padding-top:14px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:500}
.print label{display:flex;gap:7px;align-items:center;cursor:pointer}
.print input{width:18px;height:18px;accent-color:var(--brand)}
.print .pr{display:flex;gap:4px;align-items:center;font-weight:400;font-size:11px;color:var(--muted)}
.acts{border-top:1px solid var(--line2);padding-top:25px;display:grid;grid-template-columns:1fr 2fr;gap:12px}
.acts button{height:46px;border-radius:12px;font-size:12px;font-weight:700;display:flex;gap:8px;align-items:center;justify-content:center}
.acts .b{background:#fff;border:1px solid var(--line2);color:var(--brand)}
.acts .p{background:var(--brand);color:#fff;box-shadow:0 4px 6px -1px rgba(0,0,0,.1)}

/* success */
.sdlg .dh{background:#ebf5fa}
.sbody{display:grid;grid-template-columns:374px 1fr;min-height:560px}
.sbody .lsum{background:#f5fafc}
.sres{padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;border-left:1px solid #c5dbe8}
.ok{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:8px}
.ok .c{width:72px;height:72px;border-radius:50%;background:#e0f4fb;color:var(--brand);display:grid;place-items:center}
.ok h3{font-size:24px;font-weight:700;letter-spacing:-.5px}
.ok p{font-size:12px;color:var(--muted);line-height:1.6}
.pay-s{background:#ebf5fa;border:1px solid #c5dbe8;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:18px;margin-top:20px}
.pay-s .a{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.lunas{display:flex;gap:4px;align-items:center;background:#eaf7f0;color:#168153;font-size:10px;font-weight:700;padding:4px 9px;border-radius:100px}
.pay-s .big{font-size:32px;font-weight:700;color:var(--brand);letter-spacing:-1px}
.pay-s .dt{border-top:1px solid #c5dbe8;padding-top:16px;display:flex;flex-direction:column;gap:10px}
.pay-s .dt div{display:flex;justify-content:space-between;font-size:12px;line-height:18px}
.pay-s .dt span{color:var(--muted)}.pay-s .dt b{font-weight:400}.pay-s .dt b.s{font-weight:600}
.rcpt{background:#e0f4fb;border:1px solid #c5dbe8;border-radius:12px;padding:12px;display:flex;gap:10px;color:var(--ink);margin-top:14px}
.rcpt b{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
.rcpt span{font-size:11px;color:var(--muted);line-height:1.55;display:block}
.snext{border-top:1px solid #c5dbe8;padding-top:24px;display:flex;flex-direction:column;gap:14px}
.snext .two{gap:12px}
.snext button{height:46px;border-radius:12px;font-size:12px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center}
.snext .b{background:#fff;border:1px solid #c5dbe8;color:var(--brand)}
.snext .p{background:var(--brand);color:#fff}
.snext p{text-align:center;font-size:11px;color:#6b8fab}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:90vw;text-align:center}
.toast.show{opacity:1}

@media (max-width:1000px){
  .pos{flex-direction:column}
  .side{width:auto;border-left:0;border-top:1px solid var(--line)}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nav{height:auto;padding:12px 16px;flex-wrap:wrap;gap:12px}
  .dbody,.sbody{grid-template-columns:1fr}
  .rpay,.sres{border-left:0;border-top:1px solid var(--line2)}

/* ---------- state ---------- */
const S={
  cat:'Semua', q:'',
  cart:{latte:{qty:2,note:'Susu oat, tanpa gula'}, americano:{qty:1,note:'Es sedikit'}},
  no:84, name:'Nadia', takeaway:true, nameErr:false,
  pay:{method:'cash', received:100000, edc:'bca', issuer:'bca', approval:'', last4:'5678', print:true, qrLeft:QR_SECONDS, qrPaid:false, apprErr:false},
  done:null,
};
const $=s=>document.querySelector(s);
const lines=()=>Object.entries(S.cart).map(([id,v])=>({m:MENU.find(x=>x.id===id),...v}));
const sub=()=>lines().reduce((a,l)=>a+l.m.price*l.qty,0);
const tax=()=>Math.round(sub()*TAX);
const total=()=>sub()+tax();
const items=()=>lines().reduce((a,l)=>a+l.qty,0);
const meta=()=>`${lines().length} menu • ${items()} item`;
const orderNo=()=>'#CH-'+String(S.no).padStart(3,'0');
const who=()=>S.name.trim()||'Pelanggan';
const typeLong=()=>S.takeaway?'Bawa pulang (Takeaway)':'Makan di tempat (Dine in)';
const photo=(id,cls='')=>`<img src="${IMG[id]}" alt="" class="${cls}">`;

/* ---------- main screen ---------- */
function filtered(){
  const q=S.q.trim().toLowerCase();
  return MENU.filter(m=>(S.cat==='Semua'||m.cat===S.cat)&&(!q||m.name.toLowerCase().includes(q)));
}
function gridHtml(){
  const L=filtered();
  if(!L.length) return '<div class="empty">Menu tidak ditemukan.</div>';
  return L.map(m=>`<button class="card ${S.cart[m.id]?'sel':''}" data-act="add" data-id="${m.id}"><div class="ph">${photo(m.id)}</div><div class="d"><span class="n">${m.name}</span><div class="r"><span class="p">${rp(m.price)}</span><span class="plus">${I.plus()}</span></div></div></button>`).join('');
}
function footHtml(){const n=filtered().length;return `Menampilkan ${n} dari 24 menu • Semua harga belum termasuk pajak`}
function cartHtml(){
  const L=lines();
  return `<div class="top">
    <div class="sh"><h2>Pesanan baru</h2><span class="pill">${orderNo()}</span></div>
    <div class="field"><label>Nama Pemesan</label><div class="inp ${S.nameErr?'err':''}">${I.user()}<input id="nm" value="${esc(S.name)}" placeholder="Masukkan nama pemesan"></div></div>
    <div class="meta"><span>${meta()}</span><button data-act="type">${S.takeaway?'Bawa pulang':'Makan di tempat'}</button></div>
    ${L.length?L.map(l=>`<div class="oi">
      <div class="h"><span>${l.m.name}</span><span>${rp(l.m.price*l.qty)}</span></div>
      <div class="q"><span>${rp(l.m.price)} / item</span><div class="qty"><button data-act="dec" data-id="${l.m.id}" aria-label="Kurangi">${I.minus()}</button><span>${l.qty}</span><button data-act="inc" data-id="${l.m.id}" aria-label="Tambah">${I.plus()}</button></div></div>
      <div class="note"><label>Catatan Tambahan</label><div class="in">${I.pencil()}<input data-note="${l.m.id}" value="${esc(l.note||'')}" placeholder="Contoh: tanpa gula"></div></div>
    </div>`).join(''):'<p class="none">Belum ada item. Pilih menu di sebelah kiri.</p>'}
  </div>
  <div class="sum">
    <div class="r"><span>Subtotal</span><span>${rp(sub())}</span></div>
    <div class="r"><span>Pajak (10%)</span><span>${rp(tax())}</span></div>
    <div class="r t"><span>Total</span><span>${rp(total())}</span></div>
    <button class="go" data-act="pay" ${L.length?'':'disabled'}>${I.right(18)}Proses Pembayaran</button>
  </div>`;
}
function renderApp(){
  $('#app').innerHTML=`
  <header class="nav">
    <div class="brand"><div class="mark">${I.coffee(23)}</div><div><b>Cendana House</b><small>COFFEE</small></div></div>
    <div class="ws"><button class="on">${I.monitor()}Kasir</button><button data-act="barista" title="Tampilan Barista tidak ada di desain ini">${I.cup()}Barista</button></div>
    <div class="shift"><span class="pill">Kedai buka</span><div class="op"><b>Dina • Kasir</b><span>Sabtu, 10 Okt 2026 • 14.00</span></div></div>
  </header>
  <main class="pos">
    <section class="catalog">
      <div class="chead"><div><h1>Pilihan untuk setiap jeda.</h1><p>Racikan hangat, pesanan baru. Mulai dari sini.</p></div><span class="pill">24 menu tersedia</span></div>
      <label class="search">${I.search()}<input id="q" type="search" placeholder="Cari nama menu..." value="${esc(S.q)}"><kbd>⌘ K</kbd></label>
      <div class="cats">${CATS.map(c=>`<button class="cat ${c===S.cat?'on':''}" data-act="cat" data-c="${c}">${c}</button>`).join('')}</div>
      <div class="grid" id="grid">${gridHtml()}</div>
      <p class="foot" id="foot">${footHtml()}</p>
    </section>
    <aside class="side" id="side">${cartHtml()}</aside>
  </main>`;
  bindMain();
}
function bindMain(){
  const q=$('#q'); q.addEventListener('input',()=>{S.q=q.value;$('#grid').innerHTML=gridHtml();$('#foot').textContent=footHtml();});
  bindCart();
}
function bindCart(){
  const nm=$('#nm'); if(nm) nm.addEventListener('input',()=>{S.name=nm.value;S.nameErr=false;nm.parentElement.classList.remove('err');});
  document.querySelectorAll('[data-note]').forEach(el=>el.addEventListener('input',()=>{if(S.cart[el.dataset.note])S.cart[el.dataset.note].note=el.value;}));
}
function refreshCart(){$('#side').innerHTML=cartHtml();bindCart();$('#grid').innerHTML=gridHtml();}

/* ---------- decorative QR ---------- */
function qrSvg(size=140){
  const N=29,c=size/N;let s=11,r='';const rnd=()=>{s=(s*9301+49297)%233280;return s/233280};
  const inF=(i,j)=>(i<8&&j<8)||(i>N-9&&j<8)||(i<8&&j>N-9);
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){if(inF(i,j))continue;if(rnd()>.5)r+=`<rect x="${(i*c).toFixed(2)}" y="${(j*c).toFixed(2)}" width="${c.toFixed(2)}" height="${c.toFixed(2)}"/>`;}
  const f=(x,y)=>`<rect x="${x*c}" y="${y*c}" width="${7*c}" height="${7*c}"/><rect x="${(x+1)*c}" y="${(y+1)*c}" width="${5*c}" height="${5*c}" fill="#fff"/><rect x="${(x+2)*c}" y="${(y+2)*c}" width="${3*c}" height="${3*c}"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="#111" shape-rendering="crispEdges" aria-hidden="true">${r}${f(0,0)}${f(N-7,0)}${f(0,N-7)}<rect x="${size/2-17}" y="${size/2-9}" width="34" height="18" fill="#fff"/><text x="${size/2}" y="${size/2+4}" font-family="Inter,sans-serif" font-size="9" font-weight="800" fill="#005a9c" text-anchor="middle">QRIS</text></svg>`;
}

/* ---------- payment dialog ---------- */
let timerId=null;
const mmss=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
const EDC={bca:'BCA EDC',mandiri:'Mandiri EDC',bri:'BRI EDC'};
const ISS={bca:'BCA',mandiri:'Mandiri',bri:'BRI',bni:'BNI',lain:'Lainnya'};

function summaryHtml(){
  return `<div>
    <div class="ttl"><b>RINGKASAN PESANAN</b><span>${meta()}</span></div>
    ${lines().map(l=>`<div class="li"><div class="t"><span><span class="x">${l.qty}x</span>${l.m.name}</span><span>${rp(l.m.price*l.qty)}</span></div>${l.note?`<div class="nt">${I.msg()}${esc(l.note)}</div>`:''}</div>`).join('')}
  </div>`;
}
function calcHtml(lbl1,lbl2){
  return `<div class="calc">
    <div class="r"><span>Subtotal</span><span>${rp(sub())}</span></div>
    <div class="r"><span>Pajak Restoran (10%)</span><span>${rp(tax())}</span></div>
    <div class="r"><span>Biaya Takeaway / Paper bag</span><span class="g">Gratis</span></div>
    <div class="gt"><div><small>${lbl1}</small><small>${lbl2}</small></div><b>${rp(total())}</b></div>
  </div>`;
}
function paneHtml(){
  const p=S.pay;
  if(p.method==='cash'){
    const ok=p.received>=total(), kemb=Math.max(0,p.received-total());
    return `<div class="pane">
      <div><label class="lbl" for="cash">Uang Tunai Diterima</label>
        <div class="cash-in"><span class="rp">Rp</span><input id="cash" inputmode="numeric" value="${p.received?p.received.toLocaleString('id-ID'):''}" autocomplete="off"><span class="bd ${ok?'':'no'}" id="cashbd">${ok?'Cukup':'Kurang'}</span></div></div>
      <div class="kemb"><div class="l"><div class="ic">${I.coins()}</div><div><small>${ok?'KEMBALIAN KONSUMEN':'KURANG BAYAR'}</small><span>${ok?'Wajib diserahkan ke pelanggan':'Uang diterima belum mencukupi'}</span></div></div><b id="kemb" class="${ok?'':'warn'}">${rp(ok?kemb:total()-p.received)}</b></div>
    </div>`;
  }
  if(p.method==='qris'){
    const exp=p.qrLeft<=0&&!p.qrPaid;
    return `<div class="pane"><div class="qpanel">
      <div class="qtop"><div class="a"><i>QRIS</i>QRIS Dinamis Otomatis</div><span class="stat ${p.qrPaid?'ok':exp?'bad':''}" id="qstat">${p.qrPaid?'Pembayaran Diterima':exp?'Kedaluwarsa':'Menunggu Pembayaran'}</span></div>
      <div class="qbody">
        <div class="qcode"><div class="qbox ${exp?'dim':''}">${qrSvg(140)}<span class="badge">SCAN QRIS</span></div>
          <div class="timer">${I.timer()}Batas bayar: <b id="qt">${mmss(Math.max(0,p.qrLeft))}</b></div></div>
        <div class="qinfo">
          <div class="qc"><small>NOMINAL TAGIHAN QRIS</small><b>${rp(total())}</b><p>Minta pelanggan scan QRIS di layar<br>atau arahkan ke customer display.</p></div>
          <div class="qc s"><small>MENDUKUNG SEMUA PEMBAYARAN</small><div class="chips"><span>GoPay</span><span>OVO</span><span>DANA</span><span>ShopeePay</span><span>BCA / Livin</span></div></div>
          <button class="chk" data-act="qcheck">${I.refresh()}${exp?'Buat QRIS Baru':'Cek Status Pembayaran'}</button>
        </div></div>
      <p class="hint" style="margin:0">Prototipe: kode ini hanya pola demo dan tidak dapat dipindai. Tombol “Cek Status” mensimulasikan pembayaran diterima.</p>
    </div></div>`;
  }
  return `<div class="pane" style="gap:14px">
    <div class="edc"><div class="hd"><div><b>Pilih Mesin EDC Aktif</b><span class="s">Terminal kasir counter utama</span></div><span class="on">Online - Terminal #EDC-02</span></div>
      <div class="row3">${Object.entries(EDC).map(([k,v])=>`<button class="opt ${p.edc===k?'on':''}" data-act="edc" data-k="${k}">${v}</button>`).join('')}</div></div>
    <div><label class="lbl" style="font-weight:500;color:var(--muted)">Bank Penerbit Kartu</label>
      <div class="iss">${Object.entries(ISS).map(([k,v])=>`<button class="opt ${p.issuer===k?'on':''}" data-act="iss" data-k="${k}">${p.issuer===k?I.card(12):''}${v}</button>`).join('')}</div></div>
    <div class="two"><div><label class="lbl" style="font-weight:500;color:var(--muted)">Nominal Transaksi</label><div class="fld"><span style="color:var(--muted)">Rp</span><span>${total().toLocaleString('id-ID')}</span></div></div>
      <div><label class="lbl" style="font-weight:500;color:var(--muted)">Approval / Trace No. *</label><div class="fld f ${p.apprErr?'err':''}" id="apw"><input id="appr" inputmode="numeric" maxlength="6" placeholder="Contoh: 128490" value="${esc(p.approval)}" autocomplete="off"></div>
      <p class="hint ${p.apprErr?'err':''}" id="aph">Masukkan 6 digit Approval Code dari mesin EDC</p></div></div>
    <div><label class="lbl" style="font-weight:500;color:var(--muted)">4 Digit Terakhir Kartu (Opsional Audit)</label><div class="fld" style="height:38px"><input id="l4" inputmode="numeric" maxlength="4" placeholder="5678" value="${esc(p.last4)}" autocomplete="off"></div></div>
    <div class="guide">${I.circleCheck(16)}<div><b>Panduan Transaksi EDC:</b><span>1. Gesek/Dip/Tap kartu di EDC → 2. Pelanggan input PIN → 3. Masukkan Approval Code dari struk EDC</span></div></div>
  </div>`;
}
function rightHtml(){
  const m=S.pay.method;
  const tabs=[['cash','Tunai / Cash',I.cash(),''],['qris','QRIS Instant',I.qr(),'q'],['debit','Debit / EDC',I.card(),'d']];
  return `<div>
    <div class="rh"><b>PILIH METODE PEMBAYARAN</b><span class="online">Sistem Online</span></div>
    <div class="tabs">${tabs.map(t=>`<button class="tab ${m===t[0]?'on '+t[3]:''}" data-act="tab" data-k="${t[0]}">${t[2]}${t[1]}</button>`).join('')}</div>
    <div id="pane">${paneHtml()}</div>
  </div>
  <div>
    <div class="print"><label><input type="checkbox" id="prt" ${S.pay.print?'checked':''}>Cetak struk kertas otomatis setelah berhasil</label><span class="pr">${I.printer()}Thermal Printer 58mm</span></div>
    <div class="acts" style="margin-top:24px"><button class="b" data-act="cancel">${I.left()}Batal</button><button class="p" data-act="finish">Selesaikan Transaksi ${I.right()}</button></div>
  </div>`;
}
function openPay(){
  if(!S.name.trim()){S.nameErr=true;refreshCart();$('#nm').focus();toast('Isi nama pemesan dulu.');return;}
  const p=S.pay; p.method='cash'; p.received=Math.ceil(total()/50000)*50000; p.approval=''; p.apprErr=false; p.qrLeft=QR_SECONDS; p.qrPaid=false;
  $('#dlg').className='dlg';
  $('#dlg').innerHTML=`
    <div class="dh"><div class="id"><div class="sym">${I.card()}</div><div><h2>Konfirmasi &amp; Metode Pembayaran <span class="no">${orderNo()}</span></h2><p>Pemesan: <b>${esc(who())}</b> • ${typeLong()}</p></div></div><button class="dx" data-act="cancel" aria-label="Tutup">${I.x()}</button></div>
    <div class="dbody"><div class="lsum">${summaryHtml()}${calcHtml('TOTAL TAGIHAN','TERMASUK SELURUH PAJAK')}</div><div class="rpay" id="rpay">${rightHtml()}</div></div>`;
  $('#scrim').classList.add('show');document.body.style.overflow='hidden';
  startTimer();bindPane();
}
function startTimer(){
  clearInterval(timerId);
  timerId=setInterval(()=>{
    const p=S.pay; if(p.method!=='qris'||p.qrPaid)return;
    if(p.qrLeft>0){p.qrLeft--;const t=$('#qt');if(t)t.textContent=mmss(p.qrLeft);if(p.qrLeft===0)redrawPane();}
  },1000);
}
function redrawPane(){const e=$('#pane');if(e){e.innerHTML=paneHtml();bindPane();}}
function redrawRight(){const e=$('#rpay');if(e){e.innerHTML=rightHtml();bindPane();}}
function bindPane(){
  const c=$('#cash'); if(c) c.addEventListener('input',()=>{
    const v=num(c.value);S.pay.received=v;c.value=v?v.toLocaleString('id-ID'):'';
    const ok=v>=total(),b=$('#cashbd'),k=$('#kemb');
    b.textContent=ok?'Cukup':'Kurang';b.classList.toggle('no',!ok);
    k.textContent=rp(ok?v-total():total()-v);k.classList.toggle('warn',!ok);
    const lab=k.parentElement.querySelector('small'),sp=k.parentElement.querySelector('small+span');
    lab.textContent=ok?'KEMBALIAN KONSUMEN':'KURANG BAYAR';sp.textContent=ok?'Wajib diserahkan ke pelanggan':'Uang diterima belum mencukupi';
  });
  const a=$('#appr'); if(a) a.addEventListener('input',()=>{S.pay.approval=a.value.replace(/\D/g,'');a.value=S.pay.approval;S.pay.apprErr=false;$('#apw').classList.remove('err');$('#aph').classList.remove('err');});
  const l=$('#l4'); if(l) l.addEventListener('input',()=>{S.pay.last4=l.value.replace(/\D/g,'');l.value=S.pay.last4;});
  const pr=$('#prt'); if(pr) pr.addEventListener('change',()=>{S.pay.print=pr.checked;});
}
function closeDlg(){clearInterval(timerId);$('#scrim').classList.remove('show');document.body.style.overflow='';}

function finish(){
  const p=S.pay;
  if(p.method==='cash'&&p.received<total()){toast('Uang tunai diterima belum mencukupi.');return;}
  if(p.method==='qris'&&!p.qrPaid){toast('Konfirmasi dulu lewat “Cek Status Pembayaran”.');return;}
  if(p.method==='debit'&&p.approval.length!==6){p.apprErr=true;$('#apw').classList.add('err');const h=$('#aph');h.classList.add('err');h.textContent='Approval / Trace No. wajib 6 digit.';$('#appr').focus();return;}
  clearInterval(timerId);
  S.done={no:orderNo(),name:who(),type:typeLong(),method:p.method,received:p.received,issuer:ISS[p.issuer],edc:EDC[p.edc],appr:p.approval,last4:p.last4,print:p.print,total:total(),lines:lines().map(l=>({...l})),sub:sub(),tax:tax(),meta:meta()};
  showDone();
  if(p.print) toast('Struk dikirim ke Thermal Printer 58mm.');
}
function showDone(){
  const d=S.done;
  const rows={
    cash:[['Metode pembayaran','Tunai / Cash','s'],['Uang diterima',rp(d.received)],['Kembalian',rp(Math.max(0,d.received-d.total))],['Waktu transaksi','10 Okt 2026 • 14.00'],['Kasir','Dina']],
    qris:[['Metode pembayaran','QRIS Instant','s'],['Jenis QRIS','Dinamis Otomatis'],['Waktu transaksi','10 Okt 2026 • 14.00'],['Kasir','Dina']],
    debit:[['Metode pembayaran','Debit / EDC','s'],['Bank penerbit kartu',`${d.issuer}${d.last4?' • •••• '+d.last4:''}`,'s'],['Mesin EDC',d.edc],['Approval / Trace No.',d.appr],['Waktu transaksi','10 Okt 2026 • 14.00'],['Kasir','Dina']],
  }[d.method];
  const sumLines=d.lines.map(l=>`<div class="li"><div class="t"><span><span class="x">${l.qty}x</span>${l.m.name}</span><span>${rp(l.m.price*l.qty)}</span></div>${l.note?`<div class="nt">${I.msg()}${esc(l.note)}</div>`:''}</div>`).join('');
  $('#dlg').className='dlg sdlg';
  $('#dlg').innerHTML=`
    <div class="dh"><div class="id"><div class="sym" style="background:#d0e8f5">${I.circleCheck()}</div><div><h2>Transaksi Selesai <span class="no" style="background:#c5dbe8;color:var(--ink)">${d.no}</span></h2><p>Pemesan: ${esc(d.name)} • ${d.type}</p></div></div><button class="dx" data-act="newtx" aria-label="Tutup">${I.x()}</button></div>
    <div class="sbody">
      <div class="lsum"><div><div class="ttl"><b>RINGKASAN PESANAN</b><span>${d.meta}</span></div>${sumLines}</div>
        <div class="calc"><div class="r"><span>Subtotal</span><span>${rp(d.sub)}</span></div><div class="r"><span>Pajak Restoran (10%)</span><span>${rp(d.tax)}</span></div><div class="r"><span>Biaya Takeaway / Paper bag</span><span class="g">Gratis</span></div>
        <div class="gt" style="background:#ebf5fa;border-color:#60c1e5"><div><small>TOTAL DIBAYAR</small><small style="color:#6b8fab;font-weight:600">TERMASUK PAJAK</small></div><b style="color:var(--ink)">${rp(d.total)}</b></div></div></div>
      <div class="sres"><div>
        <div class="ok"><div class="c">${I.circleCheck(36)}</div><h3>Transaksi berhasil!</h3><p>Pembayaran ${esc(d.name)} telah diterima.<br>Pesanan siap diteruskan ke barista.</p></div>
        <div class="pay-s"><div class="a"><span>TOTAL PEMBAYARAN</span><span class="lunas">${I.check()}LUNAS</span></div><div class="big">${rp(d.total)}</div>
          <div class="dt">${rows.map(r=>`<div><span>${r[0]}</span><b class="${r[2]||''}">${r[1]}</b></div>`).join('')}</div></div>
        <div class="rcpt">${I.printer(16)}<div><b>Struk siap dicetak</b><span>Cetak bukti pembayaran untuk pelanggan melalui Thermal Printer 58mm.</span></div></div>
      </div>
      <div class="snext"><div class="two"><button class="b" data-act="print">${I.printer(16)}Cetak struk</button><button class="p" data-act="newtx">${I.plus()}Transaksi baru</button></div><p>Terima kasih sudah singgah di Cendana House Coffee.</p></div></div>
    </div>`;
}
function newTx(){
  closeDlg();S.cart={};S.no++;S.name='';S.nameErr=false;S.done=null;S.takeaway=true;S.q='';S.cat='Semua';renderApp();
}

/* ---------- events ---------- */
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800);}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='cat'){S.cat=b.dataset.c;renderApp();}
  else if(a==='add'){const c=S.cart[id];if(c)c.qty++;else S.cart[id]={qty:1,note:''};refreshCart();}
  else if(a==='inc'){S.cart[id].qty++;refreshCart();}
  else if(a==='dec'){if(--S.cart[id].qty<=0)delete S.cart[id];refreshCart();}
  else if(a==='type'){S.takeaway=!S.takeaway;refreshCart();}
  else if(a==='barista'){toast('Tampilan Barista tidak termasuk di desain Kasir ini.');}
  else if(a==='pay'){openPay();}
  else if(a==='tab'){S.pay.method=b.dataset.k;if(S.pay.method==='qris'&&!S.pay.qrPaid&&S.pay.qrLeft<=0)S.pay.qrLeft=QR_SECONDS;redrawRight();}
  else if(a==='edc'){S.pay.edc=b.dataset.k;redrawPane();}
  else if(a==='iss'){S.pay.issuer=b.dataset.k;redrawPane();}
  else if(a==='qcheck'){const p=S.pay;if(p.qrLeft<=0&&!p.qrPaid){p.qrLeft=QR_SECONDS;redrawPane();toast('QRIS baru dibuat.');}else{p.qrPaid=true;redrawPane();toast('Pembayaran QRIS diterima.');}}
  else if(a==='cancel'){closeDlg();}
  else if(a==='finish'){finish();}
  else if(a==='print'){toast('Struk dikirim ke Thermal Printer 58mm.');}
  else if(a==='newtx'){newTx();}
});
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim'&&!S.done)closeDlg();});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();const q=$('#q');if(q&&!$('#scrim').classList.contains('show'))q.focus();}
  if(e.key==='Escape'&&$('#scrim').classList.contains('show')&&!S.done)closeDlg();
});

renderApp();
</script>
