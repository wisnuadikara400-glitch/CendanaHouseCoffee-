<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cendana House Coffee – Pilih Tampilan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaf3fa; --surface:#ffffff; --ink:#1b3a5f; --brand:#005a9e;
  --muted:#4a7a9b; --line:#c4e3f1; --hover:#f2f8fc;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0e1f2f; --surface:#14293d; --ink:#e4f1fa; --brand:#4aa3e8;
         --muted:#8cb8d3; --line:#27506b; --hover:#1a3249; }
}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar strong{color:var(--brand);font-weight:700}
.bar span{color:var(--muted);font-size:.95rem}
main{max-width:560px;margin:0 auto;padding:44px 20px 64px}
h1{font-family:Lora,serif;font-weight:500;font-size:1.9rem;text-align:center;line-height:1.25}
.sub{text-align:center;color:var(--muted);margin:8px 0 28px}
.list{display:grid;gap:14px}
.card{display:block;text-decoration:none;color:inherit;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:18px 20px;
  transition:background .15s,border-color .15s}
.card:hover{background:var(--hover);border-color:var(--brand)}
.card:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.card h2{font-size:1.1rem;font-weight:700;margin-bottom:4px}
.card p{color:var(--muted);line-height:1.45}
</style>
</head>
<body>
<header class="bar">
  <strong>Cendana House</strong>
  <span>House Coffee</span>
</header>
<main>
  <h1>Sistem Pemesanan Cendana House</h1>
  <p class="sub">Pilih tampilan yang ingin dilihat.</p>
  <nav class="list" aria-label="Pilih tampilan">
    <a class="card" href="pelanggan.html">
      <h2>📱 Pelanggan</h2>
      <p>Lihat menu dan buat pesanan kopi.</p>
    </a>
    <a class="card" href="kasir.html">
      <h2>🧾 Kasir</h2>
      <p>Catat pesanan dan proses pembayaran.</p>
    </a>
    <a class="card" href="barista.html">
      <h2>☕ Barista</h2>
      <p>Antrean racikan yang harus disiapkan.</p>
    </a>
    <a class="card" href="manajer.html">
      <h2>📊 Manajer</h2>
      <p>Ringkasan operasional dan back-office.</p>
    </a>
  </nav>
</main>
</body>
</html>
